model:
  name: hotel_price_predictor
  version: "1.0.0"
  algorithm: xgboost

training:
  test_size: 0.2
  random_state: 42
  n_samples: 10000
  # XGBoost hyperparameters
  n_estimators: 100
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8

serving:
  host: "0.0.0.0"
  port: 8000
  model_path: "models/model.pkl"

mlflow:
  tracking_uri: "mlruns"      # local file store; swap to http://mlflow:5000 in docker
  experiment_name: "hotel_price_prediction"

monitoring:
  # model quality gate: fail CI if R2 drops below this
  min_r2_threshold: 0.85
  # data drift: alert if feature mean shifts more than this fraction
  drift_threshold: 0.15
