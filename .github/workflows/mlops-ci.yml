name: MLOps CI/CD

on:
  push:
    branches: [main, "claude/*"]
    paths:
      - "mlops/**"
      - ".github/workflows/mlops-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mlops/**"

defaults:
  run:
    working-directory: mlops   # all steps run inside mlops/

# ── Shared variables ──────────────────────────────────────────────────────────
env:
  CONTAINER_APP_NAME: hotel-price-api
  AZURE_RESOURCE_GROUP: mlops-hotel-rg

jobs:
  # ── 1. Code quality ────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mlops/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: black – code formatting
        run: black --check src/ tests/

      - name: flake8 – style & lint
        run: flake8 src/ tests/ --max-line-length=100

      - name: isort – import ordering
        run: isort --check-only src/ tests/

  # ── 2. Unit & integration tests ────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mlops/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: PYTHONPATH=. pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: mlops/coverage.xml
          flags: mlops
        continue-on-error: true

  # ── 3. Train model + quality gate ─────────────────────────────────────────
  train-and-validate:
    name: Train & Quality Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mlops/requirements.txt

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Train model
        # When running in CI without Azure, MLflow falls back to local file store.
        # In a real production run the secret AZURE_STORAGE_CONNECTION_STRING
        # is set and MLflow writes directly to Azure Blob Storage.
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'mlruns' }}
        run: PYTHONPATH=. python -m src.train

      - name: Run quality gate (R² threshold)
        run: PYTHONPATH=. python -m src.evaluate

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-${{ github.sha }}
          path: mlops/models/model.pkl
          retention-days: 30

      - name: Upload baseline stats
        uses: actions/upload-artifact@v4
        with:
          name: baseline-stats-${{ github.sha }}
          path: mlops/data/baseline_stats.csv
          retention-days: 30

  # ── 4. Build Docker image & push to Azure Container Registry ──────────────
  build-and-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    needs: train-and-validate
    # Only push on main branch pushes, not on PRs (avoids deploying WIP)
    if: github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model-${{ github.sha }}
          path: mlops/models/

      - name: Download baseline stats
        uses: actions/download-artifact@v4
        with:
          name: baseline-stats-${{ github.sha }}
          path: mlops/data/

      # Log in to Azure using a Service Principal stored as GitHub secrets.
      # Create the SP once with:
      #   az ad sp create-for-rbac --name mlops-hotel-sp --role contributor \
      #     --scopes /subscriptions/<id>
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Short SHA makes image tags human-readable and traceable back to a commit
      - name: Generate image tag
        id: image-tag
        run: |
          TAG="${{ secrets.ACR_LOGIN_SERVER }}/hotel-price-api:${{ github.sha }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      - name: Build and push Docker image to ACR
        uses: docker/build-push-action@v5
        with:
          context: ./mlops
          file: ./mlops/Dockerfile
          push: true
          tags: |
            ${{ steps.image-tag.outputs.tag }}
            ${{ secrets.ACR_LOGIN_SERVER }}/hotel-price-api:latest
          # Cache layers between builds so only changed layers are rebuilt
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/hotel-price-api:latest
          cache-to: type=inline

      - name: Smoke test image locally before deploying
        run: |
          docker pull ${{ steps.image-tag.outputs.tag }}
          docker run -d --name pre-deploy-test -p 8000:8000 ${{ steps.image-tag.outputs.tag }}
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo ""; echo "Local smoke test passed"; break
            fi
            echo "Attempt $i – waiting …"; sleep 3
          done
          docker stop pre-deploy-test && docker rm pre-deploy-test
        working-directory: .   # override: docker commands run from repo root

  # ── 5. Deploy to Azure Container Apps ────────────────────────────────────
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      # GitHub will show a live link to the deployed API in the Actions UI
      url: https://${{ steps.get-url.outputs.fqdn }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      # Update the Container App to use the newly built image.
      # Azure Container Apps handles zero-downtime rolling update automatically —
      # it spins up new replicas before draining the old ones.
      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build-and-push.outputs.image-tag }}" \
            --set-env-vars \
              MLFLOW_TRACKING_URI="${{ secrets.MLFLOW_TRACKING_URI }}" \
              AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"

      - name: Get deployed API URL
        id: get-url
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "fqdn=$FQDN" >> $GITHUB_OUTPUT
          echo "Deployed to: https://$FQDN"

      # Hit the live Azure URL to confirm deployment is healthy end-to-end
      - name: Production smoke test (live Azure URL)
        run: |
          API_URL="https://${{ steps.get-url.outputs.fqdn }}"

          echo "Testing $API_URL/health …"
          curl -sf "$API_URL/health" | python -c "
          import sys, json
          body = json.load(sys.stdin)
          assert body['status'] == 'healthy', f'Unhealthy: {body}'
          assert body['model_loaded'], 'Model not loaded in production!'
          print('Health check passed:', body)
          "

          echo "Testing $API_URL/predict …"
          curl -sf -X POST "$API_URL/predict" \
            -H "Content-Type: application/json" \
            -d '{
              "city": "London",
              "star_rating": 4,
              "amenities_count": 15,
              "distance_to_center_km": 2.5,
              "review_score": 8.7,
              "season": "peak",
              "rooms_available": 12
            }' | python -c "
          import sys, json
          body = json.load(sys.stdin)
          assert 'predicted_price_per_night' in body, 'Missing prediction'
          assert body['predicted_price_per_night'] > 0, 'Price must be positive'
          print('Production predict test passed:', body)
          "

      - name: Print deployment summary
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "  Deployment successful"
          echo "  API URL : https://${{ steps.get-url.outputs.fqdn }}"
          echo "  Image   : ${{ needs.build-and-push.outputs.image-tag }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "╚══════════════════════════════════════════════════╝"
