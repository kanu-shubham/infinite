name: MLOps CI/CD

on:
  push:
    branches: [main, "claude/*"]
    paths:
      - "mlops/**"
      - ".github/workflows/mlops-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mlops/**"

defaults:
  run:
    working-directory: mlops   # all steps run inside mlops/

jobs:
  # ── 1. Code quality ────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mlops/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: black – code formatting
        run: black --check src/ tests/

      - name: flake8 – style & lint
        run: flake8 src/ tests/ --max-line-length=100

      - name: isort – import ordering
        run: isort --check-only src/ tests/

  # ── 2. Unit & integration tests ────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mlops/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: PYTHONPATH=. pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: mlops/coverage.xml
          flags: mlops
        continue-on-error: true   # don't fail CI if codecov is unavailable

  # ── 3. Train model + quality gate ─────────────────────────────────────────
  train-and-validate:
    name: Train & Quality Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mlops/requirements.txt

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: PYTHONPATH=. python -m src.train

      - name: Run quality gate (R² threshold)
        run: PYTHONPATH=. python -m src.evaluate

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-${{ github.sha }}
          path: mlops/models/model.pkl
          retention-days: 30

      - name: Upload baseline stats
        uses: actions/upload-artifact@v4
        with:
          name: baseline-stats-${{ github.sha }}
          path: mlops/data/baseline_stats.csv
          retention-days: 30

  # ── 4. Build & smoke-test Docker image ────────────────────────────────────
  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: train-and-validate
    steps:
      - uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model-${{ github.sha }}
          path: mlops/models/

      - name: Build API image
        run: docker build -t hotel-price-api:${{ github.sha }} .

      - name: Start container
        run: |
          docker run -d \
            --name api-smoke-test \
            -p 8000:8000 \
            hotel-price-api:${{ github.sha }}

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "API is up"; exit 0
            fi
            echo "Attempt $i – waiting …"; sleep 3
          done
          echo "API did not start in time"; exit 1

      - name: Smoke test – /predict endpoint
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "city": "London",
              "star_rating": 4,
              "amenities_count": 15,
              "distance_to_center_km": 2.5,
              "review_score": 8.7,
              "season": "peak",
              "rooms_available": 12
            }' | python -c "
          import sys, json
          body = json.load(sys.stdin)
          assert 'predicted_price_per_night' in body, 'Missing prediction field'
          assert body['predicted_price_per_night'] > 0, 'Price must be positive'
          print('Smoke test passed:', body)
          "

      - name: Stop container
        if: always()
        run: docker stop api-smoke-test && docker rm api-smoke-test
