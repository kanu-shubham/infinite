name: RecSys CI/CD

on:
  push:
    branches: [main, "claude/*"]
    paths:
      - "recsys/**"
      - ".github/workflows/recsys-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "recsys/**"

defaults:
  run:
    working-directory: recsys

env:
  CONTAINER_APP_NAME: hotel-recsys-api
  AZURE_RESOURCE_GROUP: mlops-hotel-rg

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: recsys/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: black
        run: black --check src/ tests/

      - name: flake8
        run: flake8 src/ tests/ --max-line-length=100

      - name: isort
        run: isort --check-only src/ tests/

  # ── 2. Tests ───────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: recsys/requirements-dev.txt

      - name: Install dependencies
        # Install CPU-only PyTorch first to keep image small
        run: |
          pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: PYTHONPATH=. pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: recsys/coverage.xml
          flags: recsys
        continue-on-error: true

  # ── 3. Train + quality gate ────────────────────────────────────────────────
  train-and-validate:
    name: Train & Quality Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: recsys/requirements.txt

      - name: Install dependencies
        run: |
          pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Train two-tower + XGBoost ranker
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'mlruns' }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: PYTHONPATH=. python -m src.train

      - name: Run quality gate (NDCG@10 threshold)
        run: PYTHONPATH=. python -m src.evaluate

      - name: Upload model artefacts
        uses: actions/upload-artifact@v4
        with:
          name: recsys-models-${{ github.sha }}
          path: |
            recsys/models/two_tower.pt
            recsys/models/user_encoder.pkl
            recsys/models/hotel_encoder.pkl
            recsys/models/embedding_index.pkl
            recsys/models/ranker.pkl
            recsys/models/tower_config.pkl
          retention-days: 30

  # ── 4. Build & push to ACR ─────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    needs: train-and-validate
    if: github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download model artefacts
        uses: actions/download-artifact@v4
        with:
          name: recsys-models-${{ github.sha }}
          path: recsys/models/

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.RECSYS_ACR_LOGIN_SERVER }}
          username: ${{ secrets.RECSYS_ACR_USERNAME }}
          password: ${{ secrets.RECSYS_ACR_PASSWORD }}

      - name: Generate image tag
        id: image-tag
        run: |
          TAG="${{ secrets.RECSYS_ACR_LOGIN_SERVER }}/hotel-recsys-api:${{ github.sha }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./recsys
          file: ./recsys/Dockerfile
          push: true
          tags: |
            ${{ steps.image-tag.outputs.tag }}
            ${{ secrets.RECSYS_ACR_LOGIN_SERVER }}/hotel-recsys-api:latest
          cache-from: type=registry,ref=${{ secrets.RECSYS_ACR_LOGIN_SERVER }}/hotel-recsys-api:latest
          cache-to: type=inline

      - name: Pre-deploy smoke test (local container)
        run: |
          docker pull ${{ steps.image-tag.outputs.tag }}
          docker run -d --name recsys-test -p 8001:8001 ${{ steps.image-tag.outputs.tag }}
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8001/health; then
              echo ""; echo "Smoke test passed"; break
            fi
            echo "Attempt $i – waiting …"; sleep 3
          done
          docker stop recsys-test && docker rm recsys-test
        working-directory: .

  # ── 5. Deploy to Azure Container Apps ─────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production-recsys
      url: https://${{ steps.get-url.outputs.fqdn }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build-and-push.outputs.image-tag }}" \
            --set-env-vars \
              MLFLOW_TRACKING_URI="${{ secrets.MLFLOW_TRACKING_URI }}" \
              AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"

      - name: Get API URL
        id: get-url
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "fqdn=$FQDN" >> $GITHUB_OUTPUT

      - name: Production smoke test
        run: |
          API="https://${{ steps.get-url.outputs.fqdn }}"

          curl -sf "$API/health" | python -c "
          import sys, json
          b = json.load(sys.stdin)
          assert b['status'] == 'healthy', f'Unhealthy: {b}'
          print('Health OK:', b)
          "

          curl -sf -X POST "$API/recommend" \
            -H "Content-Type: application/json" \
            -d '{
              "age_group": "26-35",
              "travel_type": "business",
              "price_sensitivity": 0.3,
              "review_weight": 0.8,
              "prefers_city_center": 1,
              "loyalty_tier": "gold"
            }' | python -c "
          import sys, json
          b = json.load(sys.stdin)
          assert len(b['recommendations']) > 0, 'No recommendations returned'
          print('Recommend OK — got', len(b['recommendations']), 'results')
          "

      - name: Print deployment summary
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "  RecSys deployment successful"
          echo "  API URL : https://${{ steps.get-url.outputs.fqdn }}"
          echo "  Image   : ${{ needs.build-and-push.outputs.image-tag }}"
          echo "╚══════════════════════════════════════════════════╝"
