# ml_ci.yml
# ----------
# Continuous Integration for the ML pipeline.
#
# WHAT CI DOES FOR ML:
#   Traditional CI checks that code compiles and tests pass.
#   ML CI does all of that PLUS:
#     - Validates that training runs without crashing
#     - Checks that model quality metrics meet thresholds
#     - Detects data / feature schema changes
#     - Runs on every PR so bad models never reach main
#
# TRIGGER: runs on every pull-request that touches ml_pipeline/**

name: ML Pipeline – CI

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "ml_pipeline/**"
      - ".github/workflows/ml_ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ml_pipeline/**"

jobs:
  # ── Job 1: Lint & type-check ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint deps
        run: pip install ruff mypy

      - name: Ruff (linter + formatter check)
        run: ruff check ml_pipeline/ --select E,F,W,I

  # ── Job 2: Unit tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # Install a minimal subset (skip heavy airflow) to keep CI fast
        run: |
          pip install pandas numpy scikit-learn xgboost mlflow feast \
                      fastapi uvicorn pydantic pytest pytest-cov joblib

      - name: Run unit tests
        run: |
          cd ml_pipeline
          pytest tests/ -v --cov=. --cov-report=term-missing \
                 --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ml_pipeline/htmlcov/

  # ── Job 3: Training smoke test ───────────────────────────────────────────
  # Runs a mini training (small dataset, few estimators) to check that the
  # full training pipeline doesn't crash.  NOT a full train – that would
  # take too long for CI.
  training-smoke-test:
    name: Training Smoke Test
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn xgboost mlflow joblib

      - name: Generate data
        run: python ml_pipeline/data/generate_data.py

      - name: Run smoke training (10 trees, quick)
        # --n-estimators 10 makes it finish in seconds
        run: |
          cd ml_pipeline
          python -c "
          from training.train import train
          train(n_estimators=10, max_depth=3)
          print('Smoke test PASSED')
          "

      - name: Upload MLflow artefacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: mlruns/

  # ── Job 4: Feature schema validation ─────────────────────────────────────
  # Checks that the Feast feature definitions are syntactically correct and
  # that no feature names were accidentally deleted (breaking the API).
  feature-schema:
    name: Feature Schema Check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install feast
        run: pip install feast pandas

      - name: Generate data (needed by Feast FileSource)
        run: python ml_pipeline/data/generate_data.py

      - name: Validate feature definitions
        run: |
          python -c "
          from ml_pipeline.feature_store.feature_repo.features import (
              hotel, hotel_features, hotel_source
          )
          fields = {f.name for f in hotel_features.schema}
          required = {'star_rating', 'review_score', 'distance_km', 'amenities'}
          missing = required - fields
          assert not missing, f'Missing required features: {missing}'
          print('Feature schema OK:', sorted(fields))
          "
