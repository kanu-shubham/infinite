version: "3.9"

# Quick start:
#   docker compose up --build
#   open http://localhost:8089   ← Locust web UI
#   open http://localhost:8000/docs  ← FastAPI Swagger UI

services:

  # ── Inference API ────────────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: "2.0"      # cap to make latency numbers reproducible
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Load tester ──────────────────────────────────────────────────────────────
  locust:
    image: locustio/locust:2.24.0
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py:ro
    command: >
      -f /mnt/locust/locustfile.py
      --host http://api:8000
      --web-host 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
