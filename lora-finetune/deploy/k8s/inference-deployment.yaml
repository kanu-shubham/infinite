apiVersion: apps/v1
kind: Deployment
metadata:
  name: lora-finetune-serve
  labels: {app: lora-finetune, component: serve}
spec:
  replicas: 2
  selector:
    matchLabels: {app: lora-finetune, component: serve}
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: lora-finetune, component: serve}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: serve
          image: ghcr.io/ORG/lora-finetune:serve-latest
          args: ["--model", "/models/merged", "--max-concurrency", "8"]
          ports:
            - {name: http, containerPort: 8000}
          env:
            - name: API_AUTH_TOKEN
              valueFrom:
                secretKeyRef: {name: lora-finetune-api, key: token}
          resources:
            requests: {cpu: "4", memory: 32Gi, nvidia.com/gpu: "1"}
            limits:   {cpu: "8", memory: 64Gi, nvidia.com/gpu: "1"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 120
            periodSeconds: 30
          volumeMounts:
            - {name: model, mountPath: /models, readOnly: true}
      volumes:
        - name: model
          persistentVolumeClaim: {claimName: lora-model}
---
apiVersion: v1
kind: Service
metadata:
  name: lora-finetune-serve
spec:
  selector: {app: lora-finetune, component: serve}
  ports:
    - {name: http, port: 80, targetPort: 8000}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lora-finetune-serve
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lora-finetune-serve
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
