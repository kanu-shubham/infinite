# Tiny config for CI smoke-tests — uses a small publicly downloadable model.
experiment: test-tiny

model:
  name_or_path: sshleifer/tiny-gpt2
  torch_dtype: float32
  attn_implementation: eager
  gradient_checkpointing: false

quantization:
  enabled: false

lora:
  r: 4
  alpha: 8
  dropout: 0.0
  target_modules: [c_attn]

data:
  train_file: tests/fixtures/train.jsonl
  prompt_field: prompt
  response_field: response
  template: raw
  max_seq_length: 128
  eval_split_ratio: 0.2
  num_proc: 1

training:
  output_dir: outputs
  num_train_epochs: 1.0
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-3
  bf16: false
  fp16: false
  tf32: false
  optim: adamw_torch
  logging_steps: 1
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 1
  load_best_model_at_end: false
  report_to: []
  early_stopping_patience: null

evaluation:
  metrics: [loss, perplexity]
