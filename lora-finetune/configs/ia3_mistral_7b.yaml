# (IA)^3 — learns three rescaling vectors per layer (K, V, FFN). Even
# smaller than LoRA (~0.01% trainable), often competitive on simple
# domain-adaptation or style tasks.
experiment: ia3-mistral-7b

model:
  name_or_path: mistralai/Mistral-7B-Instruct-v0.3
  torch_dtype: bfloat16
  gradient_checkpointing: true

adapter:
  type: ia3
  target_modules: [k_proj, v_proj, down_proj]
  feedforward_modules: [down_proj]
  task_type: CAUSAL_LM

data:
  train_file: data/train.jsonl
  prompt_field: instruction
  response_field: output
  template: chatml
  max_seq_length: 1024

training:
  output_dir: ${OUTPUT_DIR:-outputs}
  num_train_epochs: 3.0
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-3
  bf16: true
  optim: adamw_torch
  report_to: [mlflow]
