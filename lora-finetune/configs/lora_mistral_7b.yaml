# Standard (non-quantized) LoRA fine-tuning of Mistral-7B on a local JSONL file.
experiment: lora-mistral-7b

model:
  name_or_path: mistralai/Mistral-7B-Instruct-v0.3
  torch_dtype: bfloat16
  attn_implementation: sdpa
  gradient_checkpointing: true

quantization:
  enabled: false

adapter:
  type: lora
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: all-linear
  use_dora: false
  use_rslora: false

data:
  train_file: data/train.jsonl
  eval_file: data/eval.jsonl
  prompt_field: instruction
  response_field: output
  template: chatml
  system_prompt: null
  max_seq_length: 2048

training:
  output_dir: ${OUTPUT_DIR:-outputs}
  num_train_epochs: 3.0
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  bf16: true
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  report_to: [mlflow]

evaluation:
  metrics: [loss, perplexity, rouge]
  max_new_tokens: 256
  num_eval_samples: 200
