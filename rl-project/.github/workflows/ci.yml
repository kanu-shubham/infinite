name: rl-project-ci

on:
  push:
    paths:
      - "rl-project/**"
  pull_request:
    paths:
      - "rl-project/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rl-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: pytest -q
