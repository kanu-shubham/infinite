version: "3.9"

volumes:
  mlruns:
  models:
  data:

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - models:/app/models
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      - mlflow

  trainer:
    build:
      context: .
      dockerfile: Dockerfile.train
    volumes:
      - models:/app/models
      - data:/app/data
      - mlruns:/app/mlruns
    environment:
      - PYTHONPATH=/app
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    profiles:
      - train
    depends_on:
      - mlflow

  mlflow:
    image: python:3.11-slim
    command: >
      bash -c "pip install mlflow -q &&
               mlflow server
               --host 0.0.0.0
               --port 5000
               --backend-store-uri /mlruns
               --default-artifact-root /mlruns"
    ports:
      - "5001:5000"    # 5001 on host to avoid clash with the price predictor
    volumes:
      - mlruns:/mlruns
    restart: unless-stopped
