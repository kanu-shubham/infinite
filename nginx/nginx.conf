events {
    worker_connections 4096;
}

http {
    upstream booking_backend {
        # Round-robin across 2 booking-service instances.
        # Docker compose's `--scale booking-service=2` exposes them as DNS names that
        # round-robin internally; we add explicit entries here for clarity.
        server booking-service:8080;
    }

    log_format combined_with_upstream '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'upstream=$upstream_addr ut=$upstream_response_time';

    access_log /var/log/nginx/access.log combined_with_upstream;

    server {
        listen 80;

        location / {
            proxy_pass http://booking_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Don't retry on errors — we want to see real per-instance behavior.
            proxy_next_upstream off;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
