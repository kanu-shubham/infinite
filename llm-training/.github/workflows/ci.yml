name: CI

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "llm-training/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "llm-training/**"

defaults:
  run:
    working-directory: llm-training

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: llm-training/pyproject.toml

      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install package (dev)
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Mypy
        run: mypy src || true  # non-blocking until types settle

      - name: Pytest (fast)
        env:
          TRANSFORMERS_OFFLINE: "0"
          HF_HUB_DISABLE_TELEMETRY: "1"
          WANDB_MODE: disabled
        run: pytest -m "not slow and not gpu" --cov=llm_train --cov-report=term-missing
